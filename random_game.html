<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <title>Random!</title>
</head>
<body>
    <nav class="navbar navbar-light" style="background-color: royalblue">
        <div class="container-fluid">
            <a class="navbar-brand mb-0 h1" href="index.html" style="color: aliceblue;">Genshin Random GoGo Kaboom</a>
        </div>
    </nav>

    <div class="container py-4 text-center">
        <h1>Random Time, <span id="current-player-name"></span>!</h1>
        <p><a href="player.html">&larr; Not you? Switch player</a></p>

        <div class="btn-group mb-3" role="group">
            <button id="mode-characters" type="button" class="btn btn-outline-primary active">Characters</button>
            <button id="mode-bosses" type="button" class="btn btn-outline-primary">Bosses</button>
        </div>

        <p id="pool-note" class="text-muted"></p>

        <div class="wheel-wrapper mx-auto mb-3">
            <div class="wheel-pointer"></div>
            <canvas id="wheel-canvas" width="400" height="400"></canvas>
        </div>

        <button id="spin-btn" class="btn btn-lg btn-success mb-3">Spin!</button>

        <h2 id="spin-result" class="d-none"></h2>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/random-game.js"></script>
</body>
</html>
