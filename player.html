<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <title>Select Player</title>
</head>
<body>
    <nav class="navbar navbar-light" style="background-color: royalblue">
        <div class="container-fluid">
            <a class="navbar-brand mb-0 h1" href="index.html" style="color: aliceblue;">Genshin Random GoGo Kaboom</a>
        </div>
    </nav>

    <div class="container py-4">
        <h1>Select Player</h1>

        <div id="player-error" class="alert alert-danger d-none"></div>

        <div id="player-list" class="mb-4"></div>

        <form id="add-player-form" class="row g-2 align-items-center mb-4">
            <div class="col-12 col-sm-auto flex-sm-grow-1">
                <input type="text" id="new-player-name" class="form-control" placeholder="Your name" required>
            </div>
            <div class="col-12 col-sm-auto">
                <button type="submit" class="btn btn-primary w-100">Add me!</button>
            </div>
        </form>

        <div id="player-hub" class="d-none">
            <h2>Playing as <span id="hub-player-name"></span></h2>

            <h3 class="mt-4" id="owned-characters-heading"></h3>
            <div id="owned-characters" class="row mb-4"></div>

            <a href="edit_char.html" class="btn btn-outline-primary me-2">Edit My Characters</a>
            <a href="random_game.html" class="btn btn-success">Random!</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/players.js"></script>
</body>
</html>
